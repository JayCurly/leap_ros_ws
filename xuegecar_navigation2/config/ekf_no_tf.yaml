### EKF 实验专用配置（不发 TF，避免与 bringup 冲突）###
ekf_filter_node:
    ros__parameters:
        frequency: 30.0
        two_d_mode: false
        publish_acceleration: true
        # 【我】实验对比用：不发 TF，只输出 /odometry/filtered 话题
        # 否则会和 bringup 的 odom→base_footprint 形成 TF 冲突
        publish_tf: false

        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom

        # 【我】轮式里程计：位置(x,y,z) + yaw角速度
        odom0: /odom
        odom0_config: [true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, true,
                       false, false, false]

        # 【我】IMU：姿态角 roll/pitch/yaw
        imu0: /imu
        imu0_config: [false, false, false,
                      true,  true,  true,
                      false, false, false,
                      false, false, false,
                      false, false, false]
